services:
  tv-orchestrator:
    build: .
    container_name: tv-orchestrator
    restart: unless-stopped
    ports:
      - "3080:3080"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TV_LIBRARY: /media/tv
      MOVIE_LIBRARY: /media/movies
      DOWNLOADS: /media/downloads
      CHANNELS_STAGING: /media/channels
      NZBGET_BROADCAST_CATEGORY: ${NZBGET_BROADCAST_CATEGORY:-orca-tv}
      ERSATZTV_URL: http://ersatztv:8409
      HOST_PROJECT_DIR: /host/project
      # Absolute path on the Proxmox host (written by ./update.sh / install.sh)
      COMPOSE_HOST_DIR: ${COMPOSE_HOST_DIR:-}
    volumes:
      - ./data:/data
      - ${TV_LIBRARY_HOST:-./media/tv}:/media/tv
      - ${MOVIE_LIBRARY_HOST:-./media/movies}:/media/movies
      - ${DOWNLOADS_HOST:-./media/downloads}:/media/downloads
      # Live-TV staging — do NOT add this path as a Plex library
      - ${CHANNELS_STAGING_HOST:-./media/channels}:/media/channels
      # Self-update from Admin → Update (git pull + rebuild)
      - .:/host/project
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ersatztv

  # Fake HDHomeRun tuner for Plex Live TV. Point media at the same staging mount.
  # Plex → Settings → Live TV & DVR → Set Up Plex Tuner → http://<host>:8409
  ersatztv:
    image: jasongdove/ersatztv:latest
    container_name: orca-ersatztv
    restart: unless-stopped
    ports:
      - "8409:8409"
    volumes:
      - ersatztv-config:/root/.local/share/ersatztv
      - ${CHANNELS_STAGING_HOST:-./media/channels}:/media/channels:ro
    environment:
      TZ: ${TZ:-America/Chicago}

volumes:
  ersatztv-config:
