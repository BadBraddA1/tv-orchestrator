<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1 · Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/lab.css" />
  </head>
  <body>
    <div class="lab-shell">
      <header class="lab-top">
        <div>
          <p class="eyebrow">Option 1 · HomeDash / ServiceDock vibe</p>
          <h1>Mission Control</h1>
        </div>
        <div id="nav"></div>
      </header>
      <div id="kpis" class="kpi-row"></div>
      <div class="grid-2">
        <section class="panel">
          <h2>Now playing / transcoding</h2>
          <div id="playing"></div>
        </section>
        <section class="panel">
          <h2>Downloads</h2>
          <div id="downloads"></div>
        </section>
        <section class="panel">
          <h2>Stack</h2>
          <div id="stack" class="svc-grid"></div>
        </section>
        <section class="panel">
          <h2>Power / restart rail</h2>
          <div id="actions" class="actions"></div>
        </section>
      </div>
    </div>
    <script type="module">
      import {
        ensureAuth, loadBundle, navHtml, renderKpis, renderPlaying, renderDownloads, renderStack, renderActions,
      } from "/js/lab-common.js";
      document.getElementById("nav").innerHTML = navHtml("/lab/mission");
      await ensureAuth();
      async function tick() {
        const b = await loadBundle();
        renderKpis(document.getElementById("kpis"), b);
        renderPlaying(document.getElementById("playing"), b.overview);
        renderDownloads(document.getElementById("downloads"), b.overview);
        renderStack(document.getElementById("stack"), b.overview);
        renderActions(document.getElementById("actions"), b.actions, ["Plex", "Live TV", "Library", "Transcode", "Deploy"]);
      }
      await tick();
      setInterval(tick, 12000);
    </script>
  </body>
</html>
